{% extends 'layouts/app.html' if current_user else 'layouts/public.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="error-page reveal">
  <div class="code gradient-text">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <div class="row" style="justify-content: center">
    <a class="btn btn-primary" href="{{ url_for('dashboard.index') if current_user else url_for('pages.home') }}"><i class="fa-solid fa-house" aria-hidden="true"></i> Go home</a>
  </div>
</div>
{% endblock %}
