{% extends 'layouts/public.html' %}
{% block title %}Sign in{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="card auth-card card-accent reveal">
    <div class="card-pad">
      <h1>Welcome <em>back.</em></h1>
      <p class="lead">Sign in to pick up where you left off.</p>

      {% if error %}
        <div class="alert alert-danger" role="alert"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i><div>{{ error }}</div></div>
      {% endif %}

      <form method="post" action="{{ url_for('auth.login') }}" class="stack" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <div class="field">
          <label class="label" for="identifier">Username or email</label>
          <input class="input" id="identifier" name="identifier" value="{{ identifier }}" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label class="label" for="password">Password</label>
          <div class="password-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="btn btn-ghost btn-icon btn-sm toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
          </div>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Sign in</button>
      </form>

      {% if demo_enabled %}
        <div class="or">or</div>
        <form method="post" action="{{ url_for('auth.demo') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-block" type="submit"><i class="fa-solid fa-play" aria-hidden="true"></i> Explore a demo account</button>
        </form>
      {% endif %}
      <p class="auth-alt">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
